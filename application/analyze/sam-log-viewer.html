<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAM Log Analyzer</title>
    <style>
        :root {
            --primary-color: #2a4d69;
            --primary-light: #4b79a1;
            --secondary-color: #f8f9fa;
            --border-color: #ddd;
            --error-color: #dc3545;
            --rx-color: #d4edda;
            --tx-color: #d1ecf1;
            --sync-color: #cce5ff;
            --error-bg: #f8d7da;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 20px;
            background-color: #fff;
        }

        h1, h2, h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        h1 {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 10px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-light);
        }

        .result-container {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            background-color: white;
        }

        .debug-section {
            background-color: var(--secondary-color);
            border-left: 4px solid var(--error-color);
            padding: 15px;
            margin-bottom: 20px;
            overflow: auto;
        }

        .summary-log {
            padding: 10px;
            background-color: var(--secondary-color);
            border-left: 4px solid var(--primary-color);
            margin-bottom: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .summary-log:hover {
            background-color: #e9ecef;
        }

        .log-section {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 14px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--secondary-color);
            font-weight: 600;
        }

        .status-rx { background-color: var(--rx-color); }
        .status-tx { background-color: var(--tx-color); }
        .status-sync { background-color: var(--sync-color); }
        .status-error { background-color: var(--error-bg); }

        .custom-data {
            font-family: monospace;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .custom-data:hover {
            white-space: normal;
            overflow: visible;
        }

        pre, code {
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }

        pre {
            background-color: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            overflow: auto;
            white-space: pre;
        }

        details {
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
        }

        summary {
            padding: 10px;
            background-color: var(--secondary-color);
            cursor: pointer;
            font-weight: 600;
        }

        details[open] summary {
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <h1>SAM Log Analyzer (Bit-Packed Version)</h1>

    <div class="controls">
        <p>Paste your SAM log output below to analyze the encoded data:</p>
        <textarea id="input-area" placeholder="Paste SAM log here..." spellcheck="false"></textarea>
        <button id="parse-btn">Parse Logs</button>
        <button id="toggle-debug-btn">Toggle Debug Info</button>
    </div>

    <div class="result-container">
        <div id="debug-panel" class="debug-section" style="display:none;"></div>
        <div id="summary-panel"></div>
        <div id="results-panel"></div>
    </div>

    <script>
        (function () {
            const elements = {
                inputArea: document.getElementById('input-area'),
                parseBtn: document.getElementById('parse-btn'),
                toggleDebugBtn: document.getElementById('toggle-debug-btn'),
                debugPanel: document.getElementById('debug-panel'),
                summaryPanel: document.getElementById('summary-panel'),
                resultsPanel: document.getElementById('results-panel')
            };

            const state = {
                debugMode: false,
                debugMessages: [],
                currentLogs: []
            };

            const CONSTANTS = {
                MAX_ACTIONS: 1000,
                SYNCH_DONE_STATUS: 14,
                UNKNOWN_STATUS: 30,
                STATUS_NAMES: {
                    0: 'RX_SUCCESS', 1: 'RX_TIMEOUT', 2: 'RX_ERROR', 3: 'RX_MALFORMED',
                    4: 'RX_LISTEN_LATE', 5: 'RX_LISTEN_FAIL', 6: 'TIMER_EVENT', 7: 'TX_DONE',
                    8: 'TX_SCHED_LATE', 9: 'TX_SCHED_FAIL', 14: 'SYNCH_DONE',
                    15: 'SYNCH_FAIL', 16: 'SKIP_SUCCESS', 17: 'RESTART_LATE',
                    18: 'RESTART_FAIL', 30: 'UNKNOWN'
                },
                HEADER_FLAGS: {
                    SLOT_IDX: 0x01,
                    SLOTS_TO_USE: 0x02,
                    SLOT_IDX_DIFF: 0x04,
                    SCAN: 0x08,
                    CUSTOM_FIELDS: 0x10,
                    DEFAULT_SLOTS_TO_USE: 0x20
                }
            };

            // Z85 Decoder (from original sam-log-viewer.html)
            const Z85 = {
                // Z85 character set
                CHARSET: "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-:+=^!/*?&<>()[]{}@%$#",

                // Validates if a string contains only Z85 characters
                isValid(str) {
                    if (!str || typeof str !== 'string') return false;
                    for (let i = 0; i < str.length; i++) {
                        if (this.CHARSET.indexOf(str[i]) === -1) {
                            return false;
                        }
                    }
                    return true;
                },

                // Decodes a Z85 string to binary data
                decode(encoded) {
                    if (!encoded || encoded.length === 0) {
                        debug("Empty Z85 input");
                        return new Uint8Array(0);
                    }

                    // Validate input
                    if (!this.isValid(encoded)) {
                        debug("Invalid Z85 characters in input");
                        return new Uint8Array(0);
                    }

                    debug(`Decoding Z85 string (length ${encoded.length})`);

                    // Build lookup table for faster decoding
                    const lookup = {};
                    for (let i = 0; i < this.CHARSET.length; i++) {
                        lookup[this.CHARSET[i]] = i;
                    }

                    // Check for padding marker
                    const paddingDigit = parseInt(encoded.charAt(0));
                    let encodedData = encoded;
                    let hasPadding = false;

                    if (!isNaN(paddingDigit) && paddingDigit >= 1 && paddingDigit <= 4) {
                        encodedData = encoded.substring(1);
                        hasPadding = true;
                        debug(`Found padding marker: ${paddingDigit}`);
                    }

                    // Ensure length is multiple of 5
                    const remainder = encodedData.length % 5;
                    if (remainder !== 0) {
                        debug(`Warning: Z85 string length (${encodedData.length}) not a multiple of 5`);
                        if (hasPadding) {
                            const paddingNeeded = 5 - remainder;
                            for (let i = 0; i < paddingNeeded; i++) {
                                encodedData += 'u';
                            }
                            debug(`Padded string to length ${encodedData.length}`);
                        }
                    }

                    // Calculate decoded size
                    const decodedSize = Math.floor(encodedData.length * 4 / 5);
                    const result = new Uint8Array(decodedSize);

                    // Decode
                    for (let i = 0, j = 0; i < encodedData.length; i += 5, j += 4) {
                        let value = 0;
                        for (let k = 0; k < 5; k++) {
                            value = value * 85 + lookup[encodedData[i + k]];
                        }

                        result[j] = (value >> 24) & 0xFF;
                        result[j + 1] = (value >> 16) & 0xFF;
                        result[j + 2] = (value >> 8) & 0xFF;
                        result[j + 3] = value & 0xFF;
                    }

                    // Handle padding
                    if (hasPadding) {
                        // Padding digit indicates how many valid bytes in last group
                        const bytesToKeep = paddingDigit; // 1, 2, 3, or 4
                        const bytesToTrim = 4 - bytesToKeep;
                        
                        if (bytesToTrim > 0) {
                            const trimmed = result.subarray(0, decodedSize - bytesToTrim);
                            debug(`Padding: keeping ${bytesToKeep} bytes, trimming ${bytesToTrim} bytes. Result: ${decodedSize} -> ${trimmed.length} bytes`);
                            return trimmed;
                        } else {
                            debug(`Padding digit is 4: no trimming needed`);
                        }
                    }

                    return result;
                }
            };

            function debug(msg) {
                state.debugMessages.push(`[${new Date().toISOString().split('T')[1].split('.')[0]}] ${msg}`);
                if (state.debugMode) console.log(msg);
            }

            // Bit Reader Class for bit-level parsing
            class BitReader {
                constructor(buffer) {
                    this.buffer = buffer;
                    this.byteOffset = 0;
                    this.bitOffset = 0;
                }

                readBits(numBits) {
                    if (numBits === 0) return 0;
                    if (numBits > 32) throw new Error('Cannot read more than 32 bits at once');

                    let result = 0;
                    let bitsRead = 0;

                    while (bitsRead < numBits) {
                        if (this.byteOffset >= this.buffer.length) {
                            throw new Error(`Buffer overflow: trying to read beyond buffer end at byte ${this.byteOffset}`);
                        }

                        // How many bits are left in the current byte (from MSB to current position)
                        const bitsAvailableInCurrentByte = 8 - this.bitOffset;
                        const bitsToReadFromCurrentByte = Math.min(numBits - bitsRead, bitsAvailableInCurrentByte);

                        // Extract bits from current byte
                        // Shift right to align the bits we want to the LSB position
                        const shift = bitsAvailableInCurrentByte - bitsToReadFromCurrentByte;
                        const mask = (1 << bitsToReadFromCurrentByte) - 1;
                        const bits = (this.buffer[this.byteOffset] >> shift) & mask;

                        // Add these bits to our result
                        result = (result << bitsToReadFromCurrentByte) | bits;
                        bitsRead += bitsToReadFromCurrentByte;
                        this.bitOffset += bitsToReadFromCurrentByte;

                        // Move to next byte if we've consumed all 8 bits
                        if (this.bitOffset >= 8) {
                            this.byteOffset++;
                            this.bitOffset = 0;
                        }
                    }

                    return result;
                }

                alignToByte() {
                    if (this.bitOffset !== 0) {
                        this.byteOffset++;
                        this.bitOffset = 0;
                    }
                }

                hasMoreData() {
                    return this.byteOffset < this.buffer.length || 
                           (this.byteOffset === this.buffer.length - 1 && this.bitOffset < 8);
                }

                getPosition() {
                    return { byte: this.byteOffset, bit: this.bitOffset };
                }
            }

            function parseActionBitPacked(bitReader, defaultSlotsToUse, currentSlotIdx) {
                const startPos = bitReader.getPosition();
                debug(`Parsing action at byte ${startPos.byte}, bit ${startPos.bit}`);

                // Read m_hdr (1 bit) and status (5 bits)
                const m_hdr = bitReader.readBits(1);
                const status = bitReader.readBits(5);
                
                debug(`Read m_hdr=${m_hdr}, status=${status} (${CONSTANTS.STATUS_NAMES[status] || 'Unknown'})`);

                const action = {
                    status,
                    statusName: CONSTANTS.STATUS_NAMES[status] || `Unknown (${status})`,
                    slotIdx: currentSlotIdx,
                    slotsToUse: defaultSlotsToUse
                };

                // Process custom status if present (10 bits)
                if (status === CONSTANTS.UNKNOWN_STATUS) {
                    const customStatus = bitReader.readBits(10);
                    action.customStatus = customStatus;
                    debug(`Custom status: ${customStatus}`);
                }

                // Process extended header if present
                if (m_hdr === 1) {
                    const hdr = bitReader.readBits(8);
                    action.hdr = hdr;
                    debug(`Header flags: 0x${hdr.toString(16).padStart(2, '0')}`);

                    // Process slot index (24 bits)
                    if (hdr & CONSTANTS.HEADER_FLAGS.SLOT_IDX) {
                        action.slotIdx = bitReader.readBits(24);
                        debug(`Slot index: ${action.slotIdx}`);
                    }

                    // Process slot index difference (16 bits, signed)
                    if (hdr & CONSTANTS.HEADER_FLAGS.SLOT_IDX_DIFF) {
                        let diff = bitReader.readBits(16);
                        if (diff & 0x8000) {
                            diff = -(0x10000 - diff);
                        }
                        action.slotIdxDiff = diff;
                        debug(`Slot index diff: ${diff}`);
                    }

                    // Process slots to use (8 bits)
                    if (hdr & CONSTANTS.HEADER_FLAGS.SLOTS_TO_USE) {
                        action.slotsToUse = bitReader.readBits(8);
                        debug(`Slots to use: ${action.slotsToUse}`);
                    }

                    // Process custom data (16 bits length + data)
                    if (hdr & CONSTANTS.HEADER_FLAGS.CUSTOM_FIELDS) {
                        const dataLength = bitReader.readBits(16);
                        action.customDataLength = dataLength;
                        debug(`Custom data length: ${dataLength}`);

                        if (dataLength > 0) {
                            // Read custom data bytes - NO byte alignment, fully bit-packed
                            const customDataBytes = [];
                            for (let i = 0; i < dataLength; i++) {
                                customDataBytes.push(bitReader.readBits(8));
                            }
                            action.customData = customDataBytes.map(b => b.toString(16).padStart(2, '0'));
                            debug(`Custom data: ${action.customData.join(' ')}`);
                        }
                    }

                    // Set flags
                    if (hdr & CONSTANTS.HEADER_FLAGS.SCAN) {
                        action.isScan = true;
                    }

                    if (hdr & CONSTANTS.HEADER_FLAGS.DEFAULT_SLOTS_TO_USE) {
                        action.setsDefaultSlots = true;
                    }
                }

                const endPos = bitReader.getPosition();
                debug(`Parsed ${action.statusName} - ended at byte ${endPos.byte}, bit ${endPos.bit}`);
                
                return action;
            }

            function parseLogDataBitPacked(buffer) {
                if (!buffer || buffer.length < 2) {
                    debug("Buffer too short");
                    return { actions: [] };
                }

                const actions = [];
                let defaultSlotsToUse = buffer[0];
                const numActions = buffer[1];
                
                debug(`Parsing buffer: ${buffer.length} bytes, ${numActions} actions expected, default slots: ${defaultSlotsToUse}`);
                debug(`Buffer hex: ${Array.from(buffer).map(b => b.toString(16).padStart(2, '0')).join(' ')}`);

                // Create bit reader starting at byte 2 (after header bytes)
                const bitReader = new BitReader(buffer.slice(2));
                
                let currentSlotIdx = 0;
                let expectedNextSlotIdx = 0;

                try {
                    for (let i = 0; i < numActions && bitReader.hasMoreData(); i++) {
                        const expectedSlotIdx = expectedNextSlotIdx;
                        debug(`\n=== Action ${i + 1}/${numActions} ===`);
                        const action = parseActionBitPacked(bitReader, defaultSlotsToUse, expectedSlotIdx);

                        // Update slot tracking
                        if (action.hdr && (action.hdr & CONSTANTS.HEADER_FLAGS.SLOT_IDX)) {
                            expectedNextSlotIdx = action.slotIdx + action.slotsToUse;
                            debug(`Action has explicit slot_idx=${action.slotIdx}, next expected=${expectedNextSlotIdx}`);
                        } else {
                            expectedNextSlotIdx += action.slotsToUse;
                            debug(`Action uses relative positioning, next expected=${expectedNextSlotIdx}`);
                        }

                        // Update current slot tracking
                        if (action.status === CONSTANTS.SYNCH_DONE_STATUS) {
                            currentSlotIdx = action.slotIdx;
                        } else {
                            currentSlotIdx = action.slotIdx + action.slotsToUse;
                        }

                        // Update default slots if specified
                        if (action.setsDefaultSlots) {
                            defaultSlotsToUse = action.slotsToUse;
                            debug(`Updated default slots to ${defaultSlotsToUse}`);
                        }

                        actions.push(action);

                        if (actions.length >= CONSTANTS.MAX_ACTIONS) {
                            debug(`Maximum actions limit reached`);
                            break;
                        }
                    }
                } catch (error) {
                    debug(`Error parsing actions: ${error.message}`);
                    console.error(error);
                }

                debug(`\nSuccessfully parsed ${actions.length} actions`);
                return { actions };
            }

            function hexDump(buffer) {
                const output = [];
                for (let i = 0; i < buffer.length; i += 16) {
                    const hex = Array.from(buffer.slice(i, i + 16))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join(' ');
                    const ascii = Array.from(buffer.slice(i, i + 16))
                        .map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.')
                        .join('');
                    output.push(`${i.toString(16).padStart(4, '0')}: ${hex.padEnd(48, ' ')}  ${ascii}`);
                }
                return output.join('\n');
            }

            function getStatusClass(status) {
                if ([0, 1, 4].includes(status)) return 'status-rx';
                if (status === 7) return 'status-tx';
                if (status === CONSTANTS.SYNCH_DONE_STATUS) return 'status-sync';
                if ([2, 3, 15].includes(status)) return 'status-error';
                return '';
            }

            function formatHeaderBits(hdr) {
                if (hdr === undefined) return '-';
                const flagNames = [];
                if (hdr & CONSTANTS.HEADER_FLAGS.SLOT_IDX) flagNames.push('SLOT_IDX');
                if (hdr & CONSTANTS.HEADER_FLAGS.SLOTS_TO_USE) flagNames.push('SLOTS_TO_USE');
                if (hdr & CONSTANTS.HEADER_FLAGS.SLOT_IDX_DIFF) flagNames.push('SLOT_IDX_DIFF');
                if (hdr & CONSTANTS.HEADER_FLAGS.SCAN) flagNames.push('SCAN');
                if (hdr & CONSTANTS.HEADER_FLAGS.CUSTOM_FIELDS) flagNames.push('CUSTOM_FIELDS');
                if (hdr & CONSTANTS.HEADER_FLAGS.DEFAULT_SLOTS_TO_USE) flagNames.push('DEFAULT_SLOTS_TO_USE');
                return flagNames.length > 0 ? flagNames.join(', ') : '-';
            }

            function processLogText(inputText) {
                const lines = inputText.split('\n').filter(line => line.trim());
                const logPattern = /LOG\[([^\]]+)\]\s+(START|END)\s+(\d+)\s+(.+)/;
                const logs = [];

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    
                    // Skip lines that don't start with LOG[
                    if (!line.includes('LOG[')) {
                        continue;
                    }

                    // Find the LOG[ marker in the line
                    const logStart = line.indexOf('LOG[');
                    if (logStart === -1) continue;
                    
                    line = line.substring(logStart);

                    // Collect the LOG[...] line plus any wrapped Z85 continuation lines
                    // Continuation lines don't have timestamps and don't start with LOG[
                    let block = line;
                    let j = i + 1;
                    const timestampRe = /^\[\d{2}:\d{2}:\d{2}\.\d{3},\d{3}\]/;
                    
                    while (j < lines.length) {
                        const nextLine = lines[j].trim();
                        // Stop if we hit another timestamped line or another LOG[ line
                        if (timestampRe.test(nextLine) || nextLine.includes('LOG[')) {
                            break;
                        }
                        // This is a continuation line with Z85 data
                        if (nextLine.length > 0) {
                            block += nextLine;
                        }
                        j++;
                    }
                    i = j - 1;

                    const match = block.match(logPattern);
                    if (!match) {
                        debug(`Failed to parse log line: ${block.substring(0, 50)}...`);
                        continue;
                    }

                    const [, logName, section, epochId, encodedData] = match;
                    debug(`Found log: ${logName} ${section} ${epochId}`);

                    try {
                        const cleanedEncoded = encodedData.trim();
                        debug(`Z85 string length: ${cleanedEncoded.length}`);
                        
                        const decodedData = Z85.decode(cleanedEncoded);
                        if (decodedData.length === 0) {
                            debug(`Failed to decode Z85 data`);
                            continue;
                        }

                        debug(`Decoded ${decodedData.length} bytes`);
                        
                        const { actions } = parseLogDataBitPacked(decodedData);
                        if (!actions || actions.length === 0) continue;

                        logs.push({
                            logName,
                            section,
                            epochId: parseInt(epochId),
                            encodedData: cleanedEncoded,
                            decodedData,
                            actions
                        });
                    } catch (e) {
                        debug(`Error processing log "${logName}": ${e.message}`);
                        console.error(e);
                    }
                }

                debug(`Found ${logs.length} valid logs`);
                return logs;
            }

            function renderSummary(logs) {
                if (!logs || logs.length === 0) {
                    elements.summaryPanel.innerHTML = '<p>No valid logs found.</p>';
                    return;
                }

                let html = '<h2>Log Summary</h2>';
                logs.forEach((log, index) => {
                    html += `
                    <div class="summary-log" data-log-index="${index}">
                        ${log.logName} - ${log.section} (Epoch ${log.epochId}): ${log.actions.length} actions
                    </div>`;
                });

                elements.summaryPanel.innerHTML = html;

                document.querySelectorAll('.summary-log').forEach(el => {
                    el.addEventListener('click', () => {
                        const logIndex = el.getAttribute('data-log-index');
                        document.getElementById(`log-section-${logIndex}`).scrollIntoView({
                            behavior: 'smooth'
                        });
                    });
                });
            }

            function renderDetails(logs) {
                if (!logs || logs.length === 0) {
                    elements.resultsPanel.innerHTML = '';
                    return;
                }

                let html = '';

                logs.forEach((log, logIndex) => {
                    html += `
                    <div id="log-section-${logIndex}" class="log-section">
                        <h2>Log: ${log.logName}, Section: ${log.section}, Epoch: ${log.epochId}</h2>
                        <p><strong>Found ${log.actions.length} actions</strong></p>`;

                    html += `
                    <details ${state.debugMode ? 'open' : ''}>
                        <summary>Z85 Encoded Data</summary>
                        <pre>${log.encodedData}</pre>
                    </details>`;

                    if (log.decodedData && log.decodedData.length > 0) {
                        html += `
                        <details ${state.debugMode ? 'open' : ''}>
                            <summary>Hex Dump of Decoded Data (${log.decodedData.length} bytes)</summary>
                            <pre>${hexDump(log.decodedData)}</pre>
                        </details>`;
                    }

                    if (log.actions && log.actions.length > 0) {
                        html += `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Status</th>
                                    <th>Custom Status</th>
                                    <th>Header Flags</th>
                                    <th>Slot Index</th>
                                    <th>Slots Used</th>
                                    <th>Sets Default</th>
                                    <th>Slot Diff</th>
                                    <th>Custom Data</th>
                                </tr>
                            </thead>
                            <tbody>`;

                        log.actions.forEach((action, idx) => {
                            html += `
                            <tr class="${getStatusClass(action.status)}">
                                <td>${idx + 1}</td>
                                <td>${action.statusName}</td>
                                <td>${action.customStatus !== undefined ? action.customStatus : '-'}</td>
                                <td>${formatHeaderBits(action.hdr)}</td>
                                <td>${action.slotIdx}</td>
                                <td>${action.slotsToUse}</td>
                                <td>${action.setsDefaultSlots ? 'Yes' : 'No'}</td>
                                <td>${action.slotIdxDiff !== undefined ? action.slotIdxDiff : '-'}</td>
                                <td class="custom-data">${action.customData ? action.customData.join(' ') : '-'}</td>
                            </tr>`;
                        });

                        html += `
                            </tbody>
                        </table>`;
                    } else {
                        html += `<p>No valid actions found in this log.</p>`;
                    }

                    html += `</div>`;
                });

                elements.resultsPanel.innerHTML = html;
            }

            function updateDebugPanel() {
                if (state.debugMessages.length === 0) {
                    elements.debugPanel.innerHTML = '';
                    return;
                }

                elements.debugPanel.innerHTML = `
                <h3>Debug Information</h3>
                <pre>${state.debugMessages.join('\n')}</pre>`;
                elements.debugPanel.style.display = state.debugMode ? 'block' : 'none';
            }

            function parseAndRender() {
                state.debugMessages = [];
                const inputText = elements.inputArea.value.trim();
                
                if (!inputText) {
                    elements.summaryPanel.innerHTML = '<p>No input provided.</p>';
                    elements.resultsPanel.innerHTML = '';
                    return;
                }

                const logs = processLogText(inputText);
                state.currentLogs = logs;

                updateDebugPanel();
                renderSummary(logs);
                renderDetails(logs);
            }

            function toggleDebugMode() {
                state.debugMode = !state.debugMode;
                elements.debugPanel.style.display = state.debugMode ? 'block' : 'none';
                renderDetails(state.currentLogs);
            }

            function initialize() {
                elements.parseBtn.addEventListener('click', parseAndRender);
                elements.toggleDebugBtn.addEventListener('click', toggleDebugMode);
                elements.debugPanel.style.display = 'none';
                elements.summaryPanel.innerHTML = '<p>Enter log data and click "Parse Logs"</p>';
            }

            initialize();
        })();
    </script>
</body>

</html>
